name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Crear release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Obtener versión de package.json
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Crear release con notas generadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe, se reutiliza."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

  build:
    name: Compilar y publicar
    needs: create-release
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      tag: ${{ needs.create-release.outputs.tag }}
