<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>fsprinter 1.5.1</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css" />
</head>
<body>
    <!-- Top bar: aviso de nueva versión disponible, siempre visible hasta actualizar -->
    <div class="alert alert-warning text-center mb-0 py-2 d-none" id="update_banner" role="alert">
        <div id="update_banner_message">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Hay una nueva versión disponible.
            <a href="#" id="update_download_link" onclick="downloadAppUpdate(); return false;">Descárgala aquí</a>.
        </div>
        <div id="update_banner_progress" class="d-none">
            <div class="progress" style="height: 6px;">
                <div class="progress-bar" id="update_progress_bar" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="small mt-1" id="update_progress_text"></div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col">
                <h1 class="h3 mt-3 mb-1"><i class="bi bi-printer me-2"></i>Impresora</h1>
                <div class="mb-2">
                    <select class="form-select" id="printer_list" name="printer"></select>
                    <div class="form-text">Selecciona la impresora de tickets que quieras utilizar.</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="d-grid gap-2 mb-2">
                    <button class="btn btn-secondary" onclick="testPrinter();"><i class="bi bi-printer me-2"></i>Probar impresora</button>
                </div>
            </div>
            <div class="col">
                <div class="d-grid gap-2 mb-3">
                    <button class="btn btn-primary" onclick="testConnection();"><i class="bi bi-wifi me-2"></i>Probar conexión</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="form-floating mb-2 position-relative">
                    <input type="text" class="form-control pe-5" id="api_url" placeholder="https://" />
                    <label for="api_url">URL</label>
                    <button type="button" class="btn btn-sm btn-link text-danger position-absolute top-50 end-0 translate-middle-y me-2 p-1 d-none" id="reset_btn" onclick="resetSettings();" title="Resetear configuración">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
                <div class="form-floating mb-2">
                    <input type="text" class="form-control" id="api_key" placeholder="Clave de API" />
                    <label for="api_key">API key</label>
                </div>
                <div class="form-floating mb-2">
                    <input type="number" class="form-control" id="printer_len" min="0" />
                    <label for="printer_len">Caracteres por línea</label>
                </div>
                <div class="form-floating mb-2">
                    <select class="form-select" id="poll_interval" onchange="onPollIntervalChange();">
                        <option value="0">Solo WebSocket</option>
                        <option value="15">15 segundos</option>
                        <option value="30">30 segundos</option>
                        <option value="60">1 minuto</option>
                        <option value="120">2 minutos</option>
                        <option value="300">5 minutos</option>
                        <option value="600">10 minutos</option>
                        <option value="1800">30 minutos</option>
                    </select>
                    <label for="poll_interval">Comprobar periódicamente</label>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bottom bar: global status -->
    <nav class="navbar fixed-bottom navbar-light bg-secondary" id="global_status_bar" title="">
        <div class="container-fluid justify-content-center">
            <span class="navbar-text text-white" id="global_status_text">
                <i class="bi bi-circle-fill me-2"></i>Iniciando…
            </span>
        </div>
    </nav>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
